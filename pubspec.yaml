name: flyers_guard
description: >
  Flutter wrapper for the FlyersSoft device-integrity SDKs. Detects whether an
  Android device is rooted or an iOS device is jailbroken via a method channel
  into prebuilt native binaries (an Android AAR and an iOS XCFramework). The
  detection logic ships as compiled binaries only -- no native source is
  distributed in this package. Also exposes the Android Play Integrity token
  request plus a backend-verification helper.
version: 0.1.0
homepage: https://github.com/FlyersSoft-Mobile/flyers_guard_flutter
repository: https://github.com/FlyersSoft-Mobile/flyers_guard_flutter
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flyerssoft.flyers_guard
        pluginClass: FlyersGuardPlugin
      ios:
        pluginClass: FlyersGuardPlugin
